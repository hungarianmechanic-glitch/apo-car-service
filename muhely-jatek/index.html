<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APO Műhely</title>
<style>
/* Egy arculat a honlappal: sötétkék, kék, világos háttér. Szándékosan egyetlen (világos) téma. */
:root {
  --navy: #071a3c; --blue: #0849a6; --ink: #12203a; --paper: #f3f7fd;
  --card: #ffffff; --line: #d5deec; --muted: #5b6b86;
  --good: #1f7a4d; --warn: #b26a00; --bad: #b3261e;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body { background: var(--paper); color: var(--ink); font: 15px/1.4 var(--font); }
#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; max-width: 1180px; margin: 0 auto;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#scene { width: 100%; aspect-ratio: 16 / 10; max-height: 42vh; display: block; background: var(--navy); }
#panel { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--card); border-top: 1px solid var(--line); }
#tabs { display: flex; gap: 2px; padding: 6px 8px 0; overflow-x: auto; }
#tabs button { flex: 1; min-width: 72px; border: 0; background: transparent; padding: 8px 6px; font: 600 13px var(--font);
  color: var(--muted); border-bottom: 3px solid transparent; }
#tabs button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }
#tabs button:disabled { opacity: .45; }
#tabview { flex: 1; overflow-y: auto; padding: 10px 16px; }
.log-row { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log-row time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 44px; }
.empty { color: var(--muted); padding: 16px 0; }
#hud { background: var(--navy); color: #fff; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.hud-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.clock { font: 700 22px var(--font); font-variant-numeric: tabular-nums; }
.date { font-size: 13px; opacity: .85; flex: 1; min-width: 0; }
.date b { font-weight: 600; }
.bar .cnt { display: block; font-size: 11px; }
.speed { display: flex; gap: 4px; }
.speed button, .btn { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 6px;
  padding: 6px 10px; font: 600 13px var(--font); min-width: 40px; }
.speed button[aria-pressed="true"] { background: #fff; color: var(--navy); }
.btn.home { background: var(--blue); border-color: var(--blue); }
.bars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.bar { font-size: 11px; min-width: 0; }
.bar b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter { height: 5px; background: rgba(255,255,255,.2); border-radius: 3px; margin-top: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: #8fb6ff; }
.meter i.low { background: #ff8a80; }
button:focus-visible { outline: 2px solid #8fb6ff; outline-offset: 2px; }
/* Lapok */
.sheet-wrap { position: fixed; inset: 0; background: rgba(7,26,60,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 14px 14px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { margin: 0 0 4px; font-size: 20px; color: var(--navy); text-wrap: balance; }
.sheet .sub { color: var(--muted); margin: 0 0 12px; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 14px; }
.sheet td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.sheet td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--good); } .down { color: var(--bad); }
.actions { display: grid; gap: 8px; margin-top: 16px; }
.actions button { border: 0; border-radius: 10px; padding: 14px; font: 600 16px var(--font); background: var(--blue); color: #fff; }
.actions button.ghost { background: transparent; color: var(--blue); border: 1px solid var(--line); }
.note { font-size: 13px; color: var(--muted); margin-top: 10px; }
#tabs button { position: relative; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; }
.muted { color: var(--muted); font-size: 13px; }
.bad { color: var(--bad); } .good { color: var(--good); }
.worker-status { position: sticky; top: 0; z-index: 2; margin: -10px -16px 10px; padding: 9px 16px; font: 600 14px var(--font);
  background: #e8f0fb; color: var(--navy); border-bottom: 1px solid var(--line); }
.worker-status.coach { background: #fff4d6; color: #6b4a00; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,183,3,.9); } 50% { box-shadow: 0 0 0 6px rgba(255,183,3,0); } }
.pulse { animation: pulse 1.2s infinite; outline: 2px solid #ffb703; outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.worker-status.bad { background: #fdecea; color: var(--bad); }
.worker-status.good { background: #e7f5ee; color: var(--good); }
.worker-status.warn { background: #fff4e0; color: var(--warn); }
.card { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 10px; margin-bottom: 8px; display: grid; gap: 3px; }
.card.focus { border-color: var(--blue); box-shadow: inset 4px 0 0 var(--blue); }
.card.sel { outline: 3px solid #ffb703; }
.c-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.c-job { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-status { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
.price { font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 13px; }
.status { font-size: 13px; font-weight: 600; }
.tag { flex: 0 0 auto; font: 600 12px var(--font); color: var(--blue); }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--blue); transition: width .4s; }
.row-actions { display: flex; gap: 6px; margin-top: 4px; }
.lift-row { display: flex; gap: 6px; margin-top: 2px; }
.lift-btn, .act { flex: 1; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 4px; font: 600 13px var(--font);
  color: var(--navy); }
.lift-btn { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 0 5px; min-height: 40px; }
.lift-btn small { font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; }
.lift-btn:disabled { opacity: .45; }
.act.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.act.mini { flex: 0 0 auto; padding: 6px 12px; min-height: 34px; }
h4.group { margin: 10px 0 6px; font: 700 11.5px var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
h4.group:first-of-type { margin-top: 2px; }
.focus-note { margin: 2px 0 0; font-size: 13px; color: var(--blue); font-weight: 600; }
.plate { display: inline-flex; align-items: center; gap: 5px; background: #fff; border: 1px solid #222; border-radius: 3px; padding: 1px 6px 1px 0;
  font: 700 13px var(--font); color: #111; letter-spacing: .02em; }
.plate i { width: 7px; align-self: stretch; background: var(--blue); }
.msg { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.msg.new { border-color: var(--blue); }
.msg.info { background: var(--paper); }
.msg header { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.msg header span { color: var(--muted); }
.msg p { margin: 6px 0; }
.msg-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.msg-foot .act { flex: 0 0 auto; padding: 8px 14px; }
.log-row.good span { color: var(--good); } .log-row.bad span { color: var(--bad); }
#toasts { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(92vw, 480px);

.toast { background: var(--navy); color: #fff; border-radius: 10px; padding: 10px 14px; font-size: 14px; box-shadow: 0 6px 20px rgba(7,26,60,.25);

.toast.good { border-left: 5px solid #4caf50; } .toast.bad { border-left: 5px solid #ff6b5b; }

.sheet h3 { margin: 16px 0 6px; font-size: 15px; color: var(--navy); }
.sheet blockquote { margin: 8px 0; padding: 8px 12px; background: var(--paper); border-left: 3px solid var(--blue); border-radius: 4px; }
.actions button small { display: block; font-weight: 400; font-size: 12px; opacity: .85; margin-top: 2px; }
.choice-label { font: 700 12px var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 6px; display: grid; gap: 2px; font: 14px var(--font); color: var(--ink); }
.seg button small { font-size: 11px; color: var(--muted); }
.seg button[aria-pressed="true"] { border-color: var(--blue); background: #e8f0fb; box-shadow: inset 0 0 0 1px var(--blue); }
.big-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
.big-row div { background: var(--paper); border-radius: 10px; padding: 10px; }
.big-row span { font-size: 12px; color: var(--muted); display: block; }
.big-row b { font-size: 22px; color: var(--navy); font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 6px 0 4px; }
.stack i { display: block; height: 100%; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.reviews { padding-left: 18px; margin: 4px 0; font-size: 14px; }
.reviews b { color: #e0a100; }
#scene { cursor: pointer; }

/* Telefon: a kép és az alsó sáv kisebb, hogy több autó férjen ki */
@media (max-width: 759px) {
  #scene { aspect-ratio: 16 / 7; max-height: 30vh; }
  #tabs { padding: 2px 6px 0; }
  #tabs button { padding: 7px 4px; min-width: 0; font-size: 13px; }
  #tabview { padding: 8px 10px; }
  .worker-status { margin: -8px -10px 8px; padding: 7px 12px; font-size: 13px; line-height: 1.3; }
}
/* Telefon és fekvő telefon: tömör alsó sáv */
@media (max-width: 759px), (max-height: 520px) {
  #hud { padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
  .hud-top { flex-wrap: nowrap; gap: 6px; }
  .clock { font-size: 20px; }
  .date { display: grid; font-size: 11px; line-height: 1.2; overflow: hidden; }
  .date b, .date span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .speed button { min-width: 34px; padding: 7px 0; }
  .btn.home { padding: 7px 10px; }
  .btn.home .wide { display: none; }
  .bars { gap: 6px; }
  .bar { font-size: 10px; line-height: 1.2; }
  .bar b { font-size: 13px; }
  .bar .cnt { display: none; }
  .meter { height: 3px; margin-top: 2px; }
}
@media (max-width: 759px) and (max-height: 700px) {
  #scene { aspect-ratio: 16 / 6; }
}
@media (min-width: 760px) {
  #app { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr; }
  #scene { grid-column: 1; grid-row: 1; max-height: none; }
  #hud { grid-column: 1; grid-row: 2; align-self: start; }
  #panel { grid-column: 2; grid-row: 1 / 3; border-top: 0; border-left: 1px solid var(--line); }
}
/* Fekvő telefon: mindig két oszlop. Balra a műhely és az alsó sáv, jobbra az autók. */
@media (orientation: landscape) and (max-height: 520px) {
  #app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 46%); grid-template-rows: minmax(0, 1fr) auto; max-width: none; }
  #scene { grid-column: 1; grid-row: 1; width: 100%; height: 100%; min-height: 0; aspect-ratio: auto; max-height: none; }
  #hud { grid-column: 1; grid-row: 2; align-self: end; }
  #panel { grid-column: 2; grid-row: 1 / 3; min-height: 0; border-top: 0; border-left: 1px solid var(--line); }
  #tabs { padding: 2px 6px 0; }
  #tabs button { padding: 6px 4px; min-width: 0; font-size: 13px; }
  #tabview { padding: 6px 8px; }
  .worker-status { margin: -6px -8px 6px; padding: 6px 10px; font-size: 12.5px; line-height: 1.3; }
  .sheet { max-height: 96dvh; max-width: 640px; border-radius: 14px 14px 0 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
